<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>選角畫面（原型）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  /* 選角畫面原型：左邊立繪卡、右邊會動的六角雷達圖（沿用遊戲的街頭傳單風） */
  :root { --ink: #121110; --paper: #efe6d2; --paper2: #e4d8bd; --fire: #ff4d1a; --yolk: #ffd23f; --mute: #8a7f6c;
    --en: Anton, Impact, "Arial Narrow", sans-serif; --body: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  html, body { margin: 0; background: radial-gradient(ellipse at 50% 30%, #2a2420, var(--ink) 75%) fixed, var(--ink); color: var(--paper); font-family: var(--body); min-height: 100%; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-left)) 28px max(16px, env(safe-area-inset-right)); display: grid; gap: 16px; }
  h1 { margin: 0; font-family: var(--en); font-weight: 400; letter-spacing: 3px; font-size: 14px; color: var(--ink); background: var(--yolk); justify-self: start; padding: 2px 10px; transform: rotate(-2deg); }
  .roster { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; }
  .roster button { flex: none; width: 58px; height: 58px; padding: 0; border: 2px solid #efe6d255; background: #2a2420; cursor: pointer; overflow: hidden; transition: transform .15s; }
  .roster button img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
  .roster button.on { border-color: var(--fire); box-shadow: 4px 4px 0 var(--fire); transform: translate(-2px, -2px); }
  .roster button:focus-visible { outline: 2px solid var(--yolk); outline-offset: 2px; }
  .panel { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 24px; align-items: center; }
  @media (max-width: 620px) { .panel { grid-template-columns: 1fr; } .card { max-width: 320px; justify-self: center; width: 100%; } }
  .card { background: var(--paper); color: var(--ink); box-shadow: 6px 6px 0 var(--fire), 0 0 0 3px var(--ink); display: grid; grid-template-rows: auto 1fr; min-width: 0; }
  .card .pic { aspect-ratio: 3 / 4; background: var(--paper2); overflow: hidden; position: relative; }
  .card .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 10%; display: block; animation: slide .35s ease-out; }
  .card .pos { position: absolute; left: 8px; top: 8px; background: var(--ink); color: var(--paper); font-weight: 900; font-size: 12px; padding: 2px 8px; letter-spacing: 1px; }
  .card .txt { padding: 10px 12px 12px; display: grid; gap: 4px; }
  .card .nm { font-size: 22px; font-weight: 900; font-style: italic; }
  .card .nm small { font-size: 12px; font-weight: 700; font-style: normal; color: #5a5245; margin-left: 6px; }
  .card .sp { font-size: 13px; font-weight: 700; color: #8a3a12; }
  .card .q { font-size: 13px; color: #3a342c; }
  @keyframes slide { from { opacity: 0; transform: translateX(-14px) scale(1.04); } to { opacity: 1; transform: none; } }
  .radarBox { position: relative; min-width: 0; }
  canvas.radar { width: 100%; max-width: 480px; aspect-ratio: 1; display: block; margin: 0 auto; }
  @media (prefers-reduced-motion: reduce) { .roster button.on { transform: none; } .card .pic img { animation: none; } }
</style>
</head><body>
<div class="wrap">
  <h1>PICK YOUR CREW</h1>
  <div class="roster" id="roster" aria-label="選角色"></div>
  <div class="panel">
    <div class="card" id="card"></div>
    <div class="radarBox"><canvas class="radar" id="radar" width="960" height="960" role="img" aria-label="能力雷達圖"></canvas></div>
  </div>
</div>
<script>
const CH = [
  { k: 'kui', name: '小葵', role: '新人實習生', pos: '後衛', sp: '咖啡衝刺', q: '我會努力的！☕' },
  { k: 'jie', name: '阿傑', role: '資深設計師', pos: '中鋒', sp: '設計稿灌籃', q: '這稿我一次就過。' },
  { k: 'mi', name: '小米', role: '總機客服', pos: '射手', sp: '總機干擾', q: '您好，這裡是總機～📞' },
  { k: 'vivi', name: 'Vivi', role: '老闆', pos: '顏值擔當', sp: '老闆說了算', q: '辛苦了！（沒有加薪）' },
  { k: 'kevin', name: 'Kevin', role: '特助', pos: '干擾', sp: '用 AI 就好', q: '這個用 AI 就好了。' },
  { k: 'lin', name: '林語彤', role: '香香籃球隊', pos: '後衛', sp: '瞬影閃身', q: '跟得上我再說。' },
  { k: 'yuan', name: '元小雨', role: '香香籃球隊', pos: '中鋒', sp: '禁區女王', q: '籃下是我的。' },
  { k: 'hu', name: '胡姬', role: '香香籃球隊', pos: '射手', sp: '千變萬化', q: '想猜我出什麼招？' },
  { k: 'tu', name: '兔兔老師', role: '山頂國小', pos: '後衛', sp: '彩蛋射籃', q: '同學們，看好囉～🐰' },
  { k: 'zhang', name: '校長', role: '山頂國小', pos: '校長', sp: '針筒超人', q: '各位同學，校長說幾句話就好。' },
  { k: 'bian', name: '小編', role: '山頂國小', pos: '前鋒', sp: '下班衝刺', q: '五點了，我要下班。' },
];
const STATS = {"bian":{"blk":60,"contest":70,"inside":82,"reb":65,"sht":85,"spd":84,"stl":70,"str":72,"three":82},"hu":{"blk":48,"contest":66,"inside":72,"reb":55,"sht":87,"spd":78,"stl":70,"str":52,"three":95},"jie":{"blk":95,"contest":85,"inside":96,"reb":94,"sht":72,"spd":60,"stl":55,"str":95,"three":35},"kevin":{"blk":70,"contest":97,"inside":70,"reb":60,"sht":76,"spd":72,"stl":70,"str":68,"three":74},"kui":{"blk":45,"contest":78,"inside":70,"reb":50,"sht":72,"spd":94,"stl":95,"str":45,"three":72},"lin":{"blk":42,"contest":80,"inside":74,"reb":48,"sht":72,"spd":97,"stl":95,"str":42,"three":70},"mi":{"blk":45,"contest":65,"inside":68,"reb":52,"sht":85,"spd":76,"stl":72,"str":50,"three":97},"tu":{"blk":45,"contest":76,"inside":70,"reb":50,"sht":74,"spd":93,"stl":92,"str":45,"three":78},"vivi":{"blk":42,"contest":60,"inside":68,"reb":55,"sht":70,"spd":62,"stl":55,"str":60,"three":72},"yuan":{"blk":97,"contest":88,"inside":96,"reb":98,"sht":70,"spd":60,"stl":58,"str":97,"three":35},"zhang":{"blk":80,"contest":75,"inside":82,"reb":82,"sht":70,"spd":58,"stl":58,"str":90,"three":62}};
// 六軸：防守＝抄截、蓋帽、干擾平均；籃板力氣＝籃板、力氣平均
const AXES = [['速度', s => s.spd], ['投籃', s => s.sht], ['三分', s => s.three], ['籃下', s => s.inside], ['防守', s => (s.stl + s.blk + s.contest) / 3], ['籃板力氣', s => (s.reb + s.str) / 2]];
const $ = id => document.getElementById(id);
const still = matchMedia('(prefers-reduced-motion: reduce)');

// ---------- 立繪卡 ----------
function renderCard(c) {
  $('card').innerHTML = `<div class="pic"><img src="../art/${c.k}_card.webp" alt="${c.name}"><span class="pos">${c.pos}</span></div>
    <div class="txt"><div class="nm">${c.name}<small>${c.role}</small></div><div class="sp">SP ${c.sp}</div><div class="q">「${c.q}」</div></div>`;
}

// ---------- 會動的雷達圖 ----------
// 換人：從上一個人的形狀彈性變形過去（第一次從中心長出來），六個頂點依序出發；數字跟著跳
// 平常：形狀輕輕呼吸、一道光繞著轉、90 分以上的頂點會發光閃爍
const cv = $('radar'), g = cv.getContext('2d'), W = cv.width, cx = W / 2, cy = W / 2, R = W * 0.33, n = AXES.length;
let from = new Array(n).fill(0), to = new Array(n).fill(0), t0 = 0;
const DUR = 700, STAG = 60;
const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];
const easeBack = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function values(now) {
  return to.map((v, i) => {
    const x = still.matches ? 1 : Math.min(1, Math.max(0, (now - t0 - i * STAG) / DUR));
    return { v: from[i] + (v - from[i]) * easeBack(x), done: x >= 1 };
  });
}
function setTarget(s) {
  const cur = values(performance.now()).map(o => o.v);
  from = cur; to = AXES.map(([, f]) => f(s)); t0 = performance.now();
}
function frame(now) {
  const vs = values(now), t = still.matches ? 0 : now / 1000;
  g.clearRect(0, 0, W, W);
  // 底網：25、50、75、100 分
  for (const lv of [0.25, 0.5, 0.75, 1]) {
    g.beginPath(); for (let i = 0; i <= n; i++) { const [x, y] = pt(i % n, R * lv); i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.strokeStyle = lv === 1 ? '#efe6d266' : '#efe6d222'; g.lineWidth = 3; g.stroke();
  }
  for (let i = 0; i < n; i++) { const [x, y] = pt(i, R); g.beginPath(); g.moveTo(cx, cy); g.lineTo(x, y); g.strokeStyle = '#efe6d222'; g.lineWidth = 2; g.stroke(); }
  // 掃描光：從中心繞著轉的扇形
  if (!still.matches) {
    const a = t * 1.1 % (Math.PI * 2);
    const grd = g.createConicGradient(a, cx, cy);
    grd.addColorStop(0, '#ffd23f30'); grd.addColorStop(0.12, '#ffd23f00'); grd.addColorStop(1, '#ffd23f00');
    g.beginPath(); for (let i = 0; i <= n; i++) { const [x, y] = pt(i % n, R); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.fillStyle = grd; g.fill();
  }
  // 能力形狀（呼吸：每個頂點微微脹縮，相位錯開）
  const breathe = i => 1 + 0.018 * Math.sin(t * 2.4 + i * 1.05);
  const P = vs.map((o, i) => pt(i, R * Math.max(0, o.v) / 100 * breathe(i)));
  g.beginPath(); P.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
  const fill = g.createRadialGradient(cx, cy, 0, cx, cy, R);
  fill.addColorStop(0, '#ff4d1a22'); fill.addColorStop(1, '#ff4d1a88');
  g.fillStyle = fill; g.fill();
  g.save(); g.shadowColor = '#ff4d1a'; g.shadowBlur = 24 + 10 * Math.sin(t * 2.4); g.strokeStyle = '#ff4d1a'; g.lineWidth = 7; g.lineJoin = 'round'; g.stroke(); g.restore();
  // 頂點：90 分以上的放大、發光、外圈擴散
  vs.forEach((o, i) => {
    const [x, y] = P[i], hi = to[i] >= 90;
    if (hi && o.done && !still.matches) {
      const p = (t * 0.9 + i * 0.17) % 1;
      g.beginPath(); g.arc(x, y, 14 + p * 34, 0, Math.PI * 2); g.strokeStyle = `rgba(255,210,63,${0.7 * (1 - p)})`; g.lineWidth = 4; g.stroke();
    }
    g.save(); if (hi) { g.shadowColor = '#ffd23f'; g.shadowBlur = 20; }
    g.beginPath(); g.arc(x, y, hi ? 15 : 10, 0, Math.PI * 2); g.fillStyle = hi ? '#ffd23f' : '#efe6d2'; g.fill(); g.restore();
  });
  // 軸名稱＋數字（數字跟著形狀一起跳）
  g.textAlign = 'center'; g.textBaseline = 'middle';
  vs.forEach((o, i) => {
    const [x, y] = pt(i, R + 92), hi = to[i] >= 90;
    g.font = '800 40px -apple-system, "PingFang TC", sans-serif'; g.fillStyle = '#e4d8bd'; g.fillText(AXES[i][0], x, y - 26);
    g.font = '400 56px Anton, Impact, sans-serif'; g.fillStyle = hi ? '#ffd23f' : '#efe6d2';
    const v = Math.round(Math.max(0, Math.min(100, o.v)));
    if (hi) { g.save(); g.shadowColor = '#ff4d1a'; g.shadowOffsetX = 4; g.shadowOffsetY = 4; g.fillText(v, x, y + 26); g.restore(); } else g.fillText(v, x, y + 26);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- 換角色 ----------
function pick(c) {
  document.querySelectorAll('#roster button').forEach(b => b.classList.toggle('on', b.dataset.k === c.k));
  renderCard(c); setTarget(STATS[c.k]);
  $('radar').setAttribute('aria-label', c.name + '能力：' + AXES.map(([l, f]) => l + Math.round(f(STATS[c.k]))).join('、'));
}
$('roster').innerHTML = CH.map(c => `<button data-k="${c.k}" aria-label="${c.name}"><img src="../art/${c.k}_card.webp" alt=""></button>`).join('');
$('roster').onclick = e => { const b = e.target.closest('button'); if (b) pick(CH.find(c => c.k === b.dataset.k)); };
document.fonts.ready.then(() => pick(CH[1]));
</script>
</body></html>
